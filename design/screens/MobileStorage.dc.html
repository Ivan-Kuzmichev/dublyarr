<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dublyarr — Хранилище (телефон)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0;background:#121110}
a{color:#F0A442}a:hover{color:#FFC577}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 1560px; background: #121110; color: #F3EFE8; font-family: Onest, 'Segoe UI', system-ui, sans-serif; overflow: hidden">
  <div style="padding: 24px 20px 110px; display: flex; flex-direction: column; gap: 18px">

    </div>
    <section style="padding: 18px; background: #1B1A18; border: 1px solid #2E2B28; border-radius: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; gap: 10px"><span style="font-family: Unbounded, 'Segoe UI', sans-serif; font-size: 26px; font-weight: 600">6,2 ТБ</span><span style="font-size: 13px; color: #A39C92">из 8 · свободно 1,8</span></div>
      <div style="height: 12px; border-radius: 6px; background: #2A2724; display: flex; gap: 2px; overflow: hidden">

      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px">
        <sc-for list="{{parts}}" as="p" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{p.c}}"></span>{{p.name}}<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A39C92">{{p.size}}</span></span></sc-for>
      </div>
    </section>
    <section style="padding: 18px; background: #1F1B16; border: 1px solid #4A3A24; border-radius: 16px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 16px; font-weight: 600">Первая уборка по правилу сезонов</span>
      <sc-for list="{{cleanup}}" as="c" hint-placeholder-count="4">
        <label style="display: flex; align-items: flex-start; gap: 12px">
          <input type="checkbox" checked="{{ true }}" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #F0A442; flex-shrink: 0">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500; line-height: 20px">{{c.title}}</span><span style="font-size: 12px; color: #8A847B">{{c.why}}</span></span>
          <span style="width: 60px; flex-shrink: 0; text-align: right; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 20px; color: #F0A442">{{c.size}}</span>
        </label>
      </sc-for>
      <button style="height: 46px; border: 0; border-radius: 12px; background: #F0A442; color: #1A1206; font-size: 15px; font-weight: 600">Удалить отмеченное · 742 ГБ</button>
    </section>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="padding: 14px; background: #1B1A18; border: 1px solid #2E2B28; border-radius: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: Unbounded, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600">+140 ГБ</span><span style="font-size: 12px; color: #A39C92">в неделю</span></div>
      <div style="padding: 14px; background: #1B1A18; border: 1px solid #2E2B28; border-radius: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: Unbounded, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600">~13 нед</span><span style="font-size: 12px; color: #A39C92">до заполнения</span></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; font-weight: 600">По сериалам</span><a href="MobileMore.dc.html" style="font-size: 14px; text-decoration: none">Правила</a></div>
    <div style="display: flex; flex-direction: column; border: 1px solid #2E2B28; border-radius: 16px; overflow: hidden">
      <sc-for list="{{shows}}" as="s" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #242220">
          <span style="width: 26px; height: 39px; flex-shrink: 0; border-radius: 5px; background: {{s.color}}"></span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">{{s.title}}</span><span style="font-size: 12px; color: {{s.rc}}">{{s.seasons}} · {{s.rule}}</span></span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #D9D3C9; white-space: nowrap">{{s.size}}</span>
          <button aria-label="Удалить сериал" style="width: 36px; height: 36px; flex-shrink: 0; border: 1px solid #2E2B28; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B5AEA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"></path></svg></button>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px">
    <dc-import name="MobileTabs" active="more" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>

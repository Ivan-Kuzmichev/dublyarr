<div style="position: relative; width: 1440px; height: 900px; background: #121110; color: #F3EFE8; font-family: Onest, 'Segoe UI', system-ui, sans-serif; overflow: hidden">

        <sc-for list="{{ghost}}" as="g" hint-placeholder-count="18"><div style="aspect-ratio: 2 / 3; border-radius: 14px; background: {{g}}"></div></sc-for>
        <sc-for list="{{ghost}}" as="g" hint-placeholder-count="18"><div style="aspect-ratio: 2 / 3; border-radius: 14px; background: {{g}}"></div></sc-for>
      </div>
      <div style="position: absolute; inset: 0; background: rgba(18,17,16,0.55)"></div>

        <span style="display: flex; align-items: center; gap: 12px"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F0A442" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.2 1.6 1 2.6 2 3 0-3 .3-5.6.8-8.2z"></path></svg><span style="font-family: Unbounded, 'Segoe UI', sans-serif; font-weight: 600; font-size: 34px">Dublyarr</span></span>

      </div>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
      <div style="width: 400px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h1 style="margin: 0; font-family: Unbounded, 'Segoe UI', sans-serif; font-weight: 600; font-size: 32px; letter-spacing: -0.02em">Вход</h1>
          <span style="font-size: 15px; color: #A39C92">Твой Dublyarr на NAS</span>
        </div>
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #B5AEA4">Логин<input value="admin" autocomplete="username" style="height: 50px; padding: 0 14px; box-sizing: border-box; background: #1B1A18; border: 1px solid #34302C; border-radius: 12px; color: #F3EFE8; font-size: 16px; outline: none"></label>
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #B5AEA4">Пароль<span style="position: relative; display: flex; flex-direction: column"><input type="password" value="0000000000" autocomplete="current-password" style="height: 50px; padding: 0 14px; box-sizing: border-box; background: #1B1A18; border: 1px solid #34302C; border-radius: 12px; color: #F3EFE8; font-size: 16px; outline: none; padding-right: 48px"><button aria-label="Показать пароль" style="position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A847B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg></button></span></label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D9D3C9"><input type="checkbox" checked="{{ true }}" style="width: 18px; height: 18px; margin: 0; accent-color: #F0A442; flex-shrink: 0">Запомнить это устройство</label>
        <a href="Login2FA.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; background: #F0A442; color: #1A1206; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none">Войти</a>
        <span style="font-size: 13px; line-height: 1.5; color: #8A847B">Забыл пароль? Сбросить можно из контейнера: <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #B5AEA4">dublyarr reset-password</span></span>
      </div>
    </div>
  </div>
</div>

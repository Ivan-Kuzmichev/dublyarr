<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dublyarr — Календарь</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#121110}
a{color:#F0A442}a:hover{color:#FFC577}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; display: flex; background: #121110; color: #F3EFE8; font-family: Onest, 'Segoe UI', system-ui, sans-serif; overflow: hidden">
  <div style="width: 232px; flex-shrink: 0; background: #171614; border-right: 1px solid #2A2724">
    <dc-import name="Sidebar" active="calendar" hint-size="232px,1000px"></dc-import>
  </div>

  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 14px; color: #A39C92">28 сентября — 4 октября</div>
        <h1 style="margin: 0; font-family: Unbounded, 'Segoe UI', sans-serif; font-weight: 600; font-size: 44px; letter-spacing: -0.02em">Календарь</h1>
      </div>
      <div style="display: flex; gap: 10px; align-items: center">
        <div style="display: flex; gap: 4px; padding: 4px; background: #1B1A18; border: 1px solid #2E2B28; border-radius: 12px">
          <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: #2A2622; color: #F3EFE8; font-size: 14px; font-weight: 500">Неделя</button>
          <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: #A39C92; font-size: 14px">Месяц</button>
          <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: #A39C92; font-size: 14px">Список</button>
        </div>
        <button aria-label="Предыдущая неделя" style="width: 44px; height: 44px; background: #1B1A18; border: 1px solid #2E2B28; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D9D3C9" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <button aria-label="Следующая неделя" style="width: 44px; height: 44px; background: #1B1A18; border: 1px solid #2E2B28; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D9D3C9" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg></button>
        <button style="height: 44px; padding: 0 16px; background: #1B1A18; border: 1px solid #2E2B28; border-radius: 12px; color: #F3EFE8; font-size: 14px">Подписка iCal</button>
      </div>
    </div>

    <div style="display: flex; gap: 20px; font-size: 13px; color: #B5AEA4">
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid #6E6962; box-sizing: border-box"></span>Эфир оригинала</span>
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; border-radius: 4px; border: 1.5px dashed #F0A442; box-sizing: border-box"></span>Ожидаемая озвучка</span>
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #D9D3C9"></span>Скачано в озвучке</span>
    </div>

    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 10px; border-radius: 16px; background: {{d.bg}}; border: 1px solid {{d.border}}">
          <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px">
            <span style="font-size: 13px; color: #A39C92">{{d.wd}}</span>
            <span style="font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 600; color: {{d.numC}}">{{d.num}}</span>
          </div>
          <sc-for list="{{d.ev}}" as="e" hint-placeholder-count="2">
            <div style="padding: 10px; border-radius: 10px; background: {{e.bg}}; border: {{e.border}}; color: {{e.fg}}; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 13px; font-weight: 600; line-height: 1.25">{{e.show}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.85">{{e.ep}}</span>
              <span style="font-size: 12px; opacity: 0.85">{{e.sub}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const o = (show, ep, sub) => ({ show, ep, sub, bg: 'transparent', border: '1.5px solid #3A3632', fg: '#D9D3C9' });
    const p = (show, ep, sub) => ({ show, ep, sub, bg: 'rgba(240,164,66,0.08)', border: '1.5px dashed #F0A442', fg: '#F3D5AA' });
    const y = (show, ep, sub) => ({ show, ep, sub, bg: '#D9D3C9', border: '1.5px solid #D9D3C9', fg: '#121110' });
    const days = [
      { wd: 'пн', num: '28', ev: [o('Джентльмены', 'S02E06', 'оригинал'), y('Рик и Морти', 'S09E02', 'Сыендук · 4K')] },
      { wd: 'вт', num: '29', ev: [o('Криминальное прошлое', 'S02E04', 'оригинал'), y('Гриффины', 'S24E01', 'OMSKBIRD')] },
      { wd: 'ср', num: '30', today: true, ev: [y('Дэдлок', 'S02E05', 'HDrezka'), y('Рик и Морти', 'S09E03', 'Сыендук · 4K'), y('Гриффины', 'S24E02', 'OMSKBIRD'), p('Криминальное прошлое', 'S02E04', 'HDrezka ≈ вечер')] },
      { wd: 'чт', num: '1', ev: [o('Соперники', 'S02E03', 'оригинал'), p('Уидоус-Бэй', 'S01E07', 'RHS ≈ +0 д')] },
      { wd: 'пт', num: '2', ev: [p('Джентльмены', 'S02E06', 'любая ≈ +3 д'), p('Криминальное прошлое', 'S02E04', 'LostFilm ≈ замена')] },
      { wd: 'сб', num: '3', ev: [o('Вместе до конца', 'S01E04', 'оригинал'), p('Истинное образование', 'S01E08', 'RuDub ≈ +5 д'), p('Соперники', 'S02E03', 'NewStudio ≈ +2 д')] },
      { wd: 'вс', num: '4', ev: [p('Devil May Cry', 'S02E02', 'AniLibria ≈ +1 д'), o('Эль', 'S01E04', 'оригинал')] }
    ].map((d) => ({ ...d, bg: d.today ? '#1F1D1B' : 'transparent', border: d.today ? '#F0A442' : '#242220', numC: d.today ? '#F0A442' : '#F3EFE8' }));
    return { days };
  }
}
</script>
</body>
</html>

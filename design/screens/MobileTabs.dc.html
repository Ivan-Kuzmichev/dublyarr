<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dublyarr — нижняя навигация</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Навигация" style="width: 390px; height: 84px; box-sizing: border-box; padding: 8px 8px 22px; background: #171614; border-top: 1px solid #2A2724; display: flex; font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
    <a href="{{t.href}}" style="position: relative; flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.fg}}; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="{{t.sw}}" stroke-linejoin="round" stroke-linecap="round"><path d="{{t.icon}}"></path></svg>
      {{t.label}}
      <sc-if value="{{t.dot}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 2px; left: 50%; margin-left: 8px; width: 8px; height: 8px; border-radius: 4px; background: #F0A442"></span></sc-if>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","library","calendar","activity","more"],"default":"today"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const raw = [
      { id: 'today', label: 'Сегодня', href: 'Mobile.dc.html', icon: 'M3 11l9-7 9 7M5 10v10h14V10' },
      { id: 'library', label: 'Библиотека', href: 'MobileLibrary.dc.html', icon: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
      { id: 'calendar', label: 'Календарь', href: 'MobileCalendar.dc.html', icon: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { id: 'activity', label: 'Загрузки', href: 'MobileActivity.dc.html', icon: 'M12 4v11M7 10l5 5 5-5M5 20h14', dot: true },
      { id: 'more', label: 'Ещё', href: 'MobileMore.dc.html', icon: 'M5 12h.01M12 12h.01M19 12h.01', sw: '3' }
    ];
    const tabs = raw.map((r) => ({ ...r, dot: !!r.dot, sw: r.sw ?? '1.8', fg: r.id === active ? '#F0A442' : '#8A847B' }));
    return { tabs };
  }
}
</script>
</body>
</html>
